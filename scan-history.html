<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan History - SecScan</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="logo">SecScan</div>

      <nav>
        <ul>
          <li><a href="index.html">Repositories</a></li>
          <li><a href="new-scan.html">New Scan</a></li>
          <li><a href="scan-history.html" class="is-active">Scan History</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">

      <header class="page-header">
        <div>
          <h1>Scan History</h1>
          <p id="history-subtitle">payment-gateway · last 5 scans</p>
        </div>
        <div class="repo-picker">
          <label for="history-repo">Repository</label>
          <select id="history-repo"></select>
        </div>
      </header>
      <div class="page-body">

      <section class="score-trend">
        <h2>Security score trend</h2>
        <p class="trend-note" id="trend-note">Down 7 points in the last scan</p>

        <ul class="chart" id="chart"></ul>

        <template id="bar-template">
          <li class="bar">
            <span class="bar-value"></span>
            <span class="bar-fill"></span>
            <span class="bar-label"></span>
          </li>
        </template>
      </section>

      <section class="history-list">
        <h2>All scans</h2>

        <table>
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Branch</th>
              <th scope="col">Score</th>
              <th scope="col">Change</th>
              <th scope="col">Findings</th>
            </tr>
          </thead>
          <tbody id="history-list"></tbody>
        </table>

        <template id="history-row-template">
          <tr>
            <td><time></time></td>
            <td><span class="branch"></span></td>
            <td><span class="score"></span></td>
            <td><span class="change"></span></td>
            <td class="history-findings"></td>
          </tr>
        </template>
      </section>
      </div>
    </main>

  </div>
  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/scan-history.js"></script>
</body>
</html>
