<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hardcoded API key - SecScan</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="logo">SecScan</div>

      <nav>
        <ul>
          <li><a href="index.html" class="is-active">Repositories</a></li>
          <li><a href="new-scan.html">New Scan</a></li>
          <li><a href="scan-history.html">Scan History</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">

      <header class="page-header">
        <div>
          <p class="breadcrumb"><a id="back-link" href="findings.html">← Findings</a></p>
          <h1>
            <span class="severity" id="finding-severity">critical</span>
            <span id="finding-title">Hardcoded API key</span>
          </h1>
        </div>
        <div class="header-actions" id="finding-actions">
          <button type="button" id="ignore-btn">Ignore</button>
          <button type="button" class="btn-primary" id="resolve-btn">Mark as resolved</button>
        </div>
      </header>
      <div class="page-body" id="page-body">

      <section class="finding-description">
        <h2>Description</h2>
        <p id="finding-description"></p>
      </section>

      <section class="affected-code">
        <h2>Affected code</h2>
        <p class="file-ref" id="finding-file"></p>
      <pre><code id="finding-snippet"></code></pre>
      </section>

      <section class="suggested-fix">
        <h2>Suggested fix</h2>
        <p id="finding-fix"></p>
      </section>

      <section class="finding-meta">
        <h2>Finding details</h2>
        <dl>
          <dt>Status</dt>
          <dd><span class="status status-open" id="finding-status">Open</span></dd>

          <dt>Scanner</dt>
          <dd id="finding-scanner"></dd>

          <dt>First seen</dt>
          <dd><time id="finding-first-seen"></time></dd>

          <dt>Category</dt>
          <dd id="finding-category"></dd>
        </dl>
      </section>

      <section class="finding-impact">
        <h2>Possible impact</h2>
        <p id="finding-impact"></p>
      </section>
      </div>
    </main>

  </div>
  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/finding-detail.js"></script>

</body>
</html>
