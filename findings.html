<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Findings - SecScan</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="logo">SecScan</div>

      <nav>
        <ul>
          <li><a href="index.html" class="is-active">Repositories</a></li>
          <li><a href="new-scan.html">New Scan</a></li>
          <li><a href="scan-history.html">Scan History</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">

      <header class="page-header">
        <div>
          <p class="breadcrumb">
            <a id="back-link" href="scan-detail.html">← payment-gateway · 25 Aug 2026 scan</a>
          </p>
          <h1>Findings</h1>
        </div>
      </header>
      <div class="page-body" id="page-body">

      <div class="toolbar">
        <label for="finding-search" class="sr-only">Search</label>
        <input type="search" id="finding-search" placeholder="Search finding or file...">

        <label for="finding-sort">Sort by</label>
        <select id="finding-sort">
          <option value="severity">Severity</option>
          <option value="file">File</option>
          <option value="tool">Tool</option>
        </select>
      </div>

      <div class="filters">
        <button type="button" class="chip chip-active" data-severity="all">All 21</button>
        <button type="button" class="chip chip-critical" data-severity="critical">Critical 3</button>
        <button type="button" class="chip chip-high" data-severity="high">High 6</button>
        <button type="button" class="chip chip-medium" data-severity="medium">Medium 9</button>
        <button type="button" class="chip chip-low" data-severity="low">Low 3</button>
      </div>

      <p class="result-count" id="result-count">Showing 21 of 21 findings</p>

      <table class="findings-table">
        <thead>
          <tr>
            <th scope="col">Severity</th>
            <th scope="col">Finding</th>
            <th scope="col">File : line</th>
            <th scope="col">Tool</th>
          </tr>
        </thead>
        <tbody id="findings-list"></tbody>
      </table>

      <template id="finding-row-template">
        <tr>
          <td><span class="severity"></span></td>
          <td><a class="finding-title" href="#"></a></td>
          <td><span class="file-ref"></span></td>
          <td class="finding-tool"></td>
        </tr>
      </template>
      </div>
    </main>

  </div>
  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/findings.js"></script>
</body>
</html>
