<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositories - SecScan</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="logo">SecScan</div>

      <nav>
        <ul>
          <li><a href="index.html" class="is-active">Repositories</a></li>
          <li><a href="new-scan.html">New Scan</a></li>
          <li><a href="scan-history.html">Scan History</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">

      <header class="page-header">
        <div>
          <h1>Repositories</h1>
          <p id="repo-count">5 repositories monitored</p>
        </div>
        <button type="button" class="btn-primary">+ New Scan</button>
      </header>
      <div class="page-body">
      <div class="toolbar">
        <label for="repo-search" class="sr-only">Search</label>
        <input type="search" id="repo-search" placeholder="Search repositories...">

        <label for="repo-sort">Sort by</label>
        <select id="repo-sort">
          <option value="score">Security score</option>
          <option value="name">Name</option>
          <option value="date">Last scan</option>
        </select>
      </div>

      <table class="repo-table">
        <thead>
          <tr>
            <th scope="col">Repository</th>
            <th scope="col">Branch</th>
            <th scope="col">Last scan</th>
            <th scope="col">Score</th>
            <th scope="col">Findings</th>
          </tr>
        </thead>

      <tbody id="repo-list"></tbody>
      </table>

      <template id="repo-row-template">
        <tr>
          <td>
            <a class="repo-name" href="#"></a>
            <span class="repo-org"></span>
          </td>
          <td><span class="branch"></span></td>
          <td class="repo-date"></td>
          <td><span class="score"></span></td>
          <td class="repo-findings"></td>
        </tr>
      </template>
      </div>
    </main>

  </div>
  <script src="data/mock-data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/repositories.js"></script>

</body>
</html>
